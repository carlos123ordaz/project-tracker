<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B5EF0"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <!-- Subtle inner shadow at top -->
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="white" stop-opacity=".12"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7.5" fill="url(#a)"/>
  <!-- Top gloss -->
  <rect width="32" height="14" rx="7.5" fill="url(#b)"/>

  <!-- Ascending bar chart — 3 columns left→right, bottom-aligned at y=27 -->
  <!-- Bar 1: short (low progress) -->
  <rect x="5"  y="19" width="6" height="8"  rx="1.5" fill="white" fill-opacity=".40"/>
  <!-- Bar 2: medium -->
  <rect x="13" y="12" width="6" height="15" rx="1.5" fill="white" fill-opacity=".72"/>
  <!-- Bar 3: tall (high progress) -->
  <rect x="21" y="5"  width="6" height="22" rx="1.5" fill="white"/>

  <!-- Small tick on top of bar 3 to suggest "goal reached" -->
  <path d="M22.5 8.5 L24 6.5 L26.5 10" stroke="white" stroke-width="1.2"
        stroke-linecap="round" stroke-linejoin="round" fill="none" opacity=".0"/>
</svg>
